# Netlify — export statique (vitrine uniquement, PAS d'admin ni d'auth)
# Renommer en netlify.toml si vous voulez ce mode, ou :
#   build command = cd frontend && npm ci && npm run build:netlify
#   publish = frontend/out

[build]
  command = "cd frontend && npm ci && npm run build:netlify"
  publish = "frontend/out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  STATIC_EXPORT = "true"
